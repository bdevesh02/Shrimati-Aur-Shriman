# Shrimati & Shriman — site-wide settings
# Most personal details are edited from /admin/ or _data/couple.yml.

title: "Shrimati & Shriman"
author: "Shrimati & Shriman"
description: "A digital scrapbook of photographs, memories, important dates, and love notes."
language: "en"
url: ""

navbar-links:
  Home: "/"
  Our Story: "/story/"
  Gallery: "/gallery/"
  Love Notes: "/love-notes/"
  Important Dates: "/important-dates/"
  About Us: "/about/"

avatar: "/assets/img/favicon.svg"
round-avatar: false

# This scrapbook does not need public social-media links.
social-network-links: {}
share-links-active: {}
title-on-all-pages: true
excerpt_length: 36
post_search: false
edit_page_button: false
navbar-var-length: true
keywords: "couple scrapbook, memories, photo gallery, love notes"

page-col: "#FFF9F4"
text-col: "#3F2A2D"
link-col: "#8C2942"
hover-col: "#A3465E"
navbar-col: "#FFF9F4"
navbar-text-col: "#4E3035"
navbar-border-col: "#E8D7CF"
footer-col: "#3F202A"
footer-text-col: "#F7EDE7"
footer-link-col: "#E8C98B"
footer-hover-col: "#FFFFFF"
mobile-theme-col: "#7A233A"

site-css:
  - "/assets/css/scrapbook.css"
site-js:
  - "/assets/js/scrapbook.js"

date_format: "%B %-d, %Y"
timezone: "Indian/Mauritius"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

collections:
  memories:
    output: true
    permalink: /story/:name/
  love_notes:
    output: true
    permalink: /love-notes/:name/
  gallery:
    output: false
  important_dates:
    output: false

defaults:
  - scope:
      path: ""
      type: "memories"
    values:
      layout: "memory"
      show-avatar: false
      nav-short: true
  - scope:
      path: ""
      type: "love_notes"
    values:
      layout: "love-note"
      show-avatar: false
      nav-short: true
  - scope:
      path: ""
    values:
      layout: "page"
      show-avatar: false
      nav-short: true

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - NOTICE.md
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap

