<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7a233a">
  <title>Scrapbook publishing dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <style>
    body { background: #fff9f4; }
    .cms-loading { color: #4b1827; font: 1rem/1.5 system-ui, sans-serif; left: 50%; position: fixed; text-align: center; top: 45%; transform: translate(-50%, -50%); }
    .cms-loading strong { display: block; font: 2rem Georgia, serif; margin-bottom: .5rem; }
  </style>
</head>
<body>
  <div class="cms-loading"><strong>Shrimati &amp; Shriman</strong>Opening the publishing dashboard…</div>
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script>
    (function () {
      var loading = document.querySelector('.cms-loading');
      function hideLoading() {
        var cms = document.querySelector('#nc-root');
        if (cms && cms.children.length) {
          loading.remove();
          observer.disconnect();
        }
      }
      var observer = new MutationObserver(hideLoading);
      observer.observe(document.body, { childList: true, subtree: true });
      hideLoading();
    })();
  </script>
</body>
</html>
