name: Validate scrapbook

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  build:
    name: Build production site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check essential output
        run: |
          test -f _site/index.html
          test -f _site/story/index.html
          test -f _site/gallery/index.html
          test -f _site/love-notes/index.html
          test -f _site/admin/index.html
